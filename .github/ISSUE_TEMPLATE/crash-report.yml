name: Crash / unexpected termination
description: Report a reproducible crash using synthetic or authorized non-PII data.
title: "[CRASH] "
labels: []
body:
  - type: input
    id: release
    attributes:
      label: Release tag and ZIP SHA-256
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows edition/version/build
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Exact observed behavior / error
    validations:
      required: true
  - type: textarea
    id: recovery
    attributes:
      label: Data/recovery outcome
      description: State whether evaluation data was preserved, duplicated, corrupted, or lost.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: Logs/screenshots are redacted and contain no real student data, credentials, private source, or sensitive institutional information.
          required: true
