name: OMR misread / grading observation
description: Report a reproducible OMR result using synthetic or explicitly authorized non-PII input only.
title: "[OMR-OBSERVATION] "
labels: []
body:
  - type: input
    id: release
    attributes:
      label: Release tag
    validations:
      required: true
  - type: input
    id: sha
    attributes:
      label: ZIP SHA-256
    validations:
      required: true
  - type: input
    id: form
    attributes:
      label: Form/profile identity
    validations:
      required: true
  - type: textarea
    id: groundtruth
    attributes:
      label: Synthetic/authorized ground truth
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result and review status
    validations:
      required: true
  - type: textarea
    id: capture
    attributes:
      label: Capture conditions
      description: Rotation, blur, shadow, resolution, scanner/camera, compression, or other relevant conditions.
  - type: checkboxes
    id: data
    attributes:
      label: Data authorization
      options:
        - label: This report contains no real student data or unauthorized PII.
          required: true
