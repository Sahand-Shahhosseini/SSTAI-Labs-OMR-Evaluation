name: Verify Public Eval7 Release
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: public-eval7-reviewed-validation
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository_owner == 'Sahand-Shahhosseini' && github.actor == 'Sahand-Shahhosseini' }}
    runs-on: [self-hosted, Windows, X64, aens-github-win-v2, repo-sstai-labs-omr-evaluation]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: _public_eval7/${{ github.run_id }}-${{ github.run_attempt }}
        shell: 'C:\Users\Sahand\AppData\Local\Programs\Python\Python313\python.exe -B -X utf8 {0}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: false
          path: _public_eval7/${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify documentation and manifest consistency
        run: |
          from pathlib import Path
          expected='e97eb321b15efd3068a9b10b9f3e399cb8b1a2495e33d8b5d82cb792ba347a23'
          assert expected+'  OMR_Current_Eval7_Professor_Installable.zip' in Path('SHA256SUMS.txt').read_text(encoding='utf-8')
          assert expected in Path('README.md').read_text(encoding='utf-8')
          assert expected in Path('PROVENANCE.md').read_text(encoding='utf-8')
          import json
          expected='e97eb321b15efd3068a9b10b9f3e399cb8b1a2495e33d8b5d82cb792ba347a23'
          with open('PACKAGE_MANIFEST_EVAL7.json',encoding='utf-8-sig') as f:
              m=json.load(f)
          assert m['package_sha256']==expected, (m['package_sha256'], expected)
          assert m['package_name']=='OMR_Current_Eval7_Professor_Installable.zip'
          assert m['package_size_bytes']==5136381
          assert m['release_id']==389939118
          assert m['release_asset_id']==568003218
          assert m['file_count']==len(m['files'])
          assert len({row['path'] for row in m['files']})==m['file_count']
          with open('BUILD_ATTESTATION_EVAL7.json',encoding='utf-8-sig') as f:
              a=json.load(f)
          assert a['output_zip_sha256']==expected
          assert a['attestation_class']=='PUBLISHER_SELF_ATTESTED_WITH_NATIVE_GITHUB_RUN_POINTERS'
          with open('SBOM_EVAL7_PARTIAL.cdx.json',encoding='utf-8-sig') as f:
              s=json.load(f)
          assert s['bomFormat']=='CycloneDX'
          assert s['specVersion']=='1.5'
          hashes={x['alg']:x['content'] for x in s['metadata']['component']['hashes']}
          assert hashes['SHA-256']==expected
          coverage={p['name']:p['value'] for p in s['metadata']['component'].get('properties',[])}
          assert coverage['sstai:sbom:coverage']=='PARTIAL_PUBLIC_INVENTORY_NOT_COMPLETE_TRANSITIVE_SBOM'
          print('DOCUMENT_MANIFEST_CONSISTENCY=PASS')
      - name: Download public release asset and independently recompute SHA-256
        run: |
          import urllib.request,time
          def download(url,target):
              for attempt in range(5):
                  try:
                      request=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','User-Agent':'SSTAI-existing-public-release-validator'})
                      with urllib.request.urlopen(request,timeout=60) as response:
                          data=response.read()
                      from pathlib import Path
                      Path(target).write_bytes(data)
                      return
                  except Exception:
                      if attempt==4:raise
                      time.sleep(2)
          download('https://github.com/Sahand-Shahhosseini/SSTAI-Labs-OMR-Evaluation/releases/download/v0.1.0-eval.7-current-professor/OMR_Current_Eval7_Professor_Installable.zip','eval7.zip')
          import hashlib
          from pathlib import Path
          data=Path('eval7.zip').read_bytes()
          assert hashlib.sha256(data).hexdigest()=='e97eb321b15efd3068a9b10b9f3e399cb8b1a2495e33d8b5d82cb792ba347a23'
          assert len(data)==5136381
          print('PUBLIC_ASSET_SHA256_RECOMPUTE=PASS')
      - name: Verify published receipt asset independently
        run: |
          import urllib.request,time
          def download(url,target):
              for attempt in range(5):
                  try:
                      request=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','User-Agent':'SSTAI-existing-public-release-validator'})
                      with urllib.request.urlopen(request,timeout=60) as response:
                          data=response.read()
                      from pathlib import Path
                      Path(target).write_bytes(data)
                      return
                  except Exception:
                      if attempt==4:raise
                      time.sleep(2)
          download('https://github.com/Sahand-Shahhosseini/SSTAI-Labs-OMR-Evaluation/releases/download/v0.1.0-eval.7-current-professor/FINAL_RECEIPT.txt','final_receipt.txt')
          import hashlib
          from pathlib import Path
          data=Path('final_receipt.txt').read_bytes()
          assert hashlib.sha256(data).hexdigest()=='cb6f53f4fb0818fa84a27d7c6346b42abe0e56c4ee804f634b6c063f4ae7ab74'
          assert 'e97eb321b15efd3068a9b10b9f3e399cb8b1a2495e33d8b5d82cb792ba347a23' in data.decode('utf-8')
          print('PUBLIC_RECEIPT_SHA256_RECOMPUTE=PASS')
      - name: Verify ZIP members byte-for-byte against package manifest
        run: |
          import hashlib, json, zipfile
          from pathlib import PurePosixPath
          
          with open('PACKAGE_MANIFEST_EVAL7.json',encoding='utf-8-sig') as f:
              manifest=json.load(f)
          expected={row['path']:(int(row['size_bytes']),row['sha256'].lower()) for row in manifest['files']}
          with zipfile.ZipFile('eval7.zip','r') as z:
              infos=[i for i in z.infolist() if not i.is_dir()]
              actual_names=[PurePosixPath(i.filename).as_posix() for i in infos]
              if len(actual_names)!=len(set(actual_names)):
                  raise SystemExit('duplicate ZIP member path detected')
              if set(actual_names)!=set(expected):
                  raise SystemExit(f'ZIP member mismatch missing={sorted(set(expected)-set(actual_names))} extra={sorted(set(actual_names)-set(expected))}')
              for info in infos:
                  name=PurePosixPath(info.filename).as_posix()
                  data=z.read(info)
                  size,digest=expected[name]
                  if len(data)!=size:
                      raise SystemExit(f'size mismatch {name}: {len(data)} != {size}')
                  got=hashlib.sha256(data).hexdigest()
                  if got!=digest:
                      raise SystemExit(f'hash mismatch {name}: {got} != {digest}')
          print(f'ZIP_MEMBER_MANIFEST=PASS files={len(expected)}')
      - name: Verify GitHub release metadata and asset identity
        run: |
          import urllib.request,time
          def download(url,target):
              for attempt in range(5):
                  try:
                      request=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','User-Agent':'SSTAI-existing-public-release-validator'})
                      with urllib.request.urlopen(request,timeout=60) as response:
                          data=response.read()
                      from pathlib import Path
                      Path(target).write_bytes(data)
                      return
                  except Exception:
                      if attempt==4:raise
                      time.sleep(2)
          download('https://api.github.com/repos/Sahand-Shahhosseini/SSTAI-Labs-OMR-Evaluation/releases/tags/v0.1.0-eval.7-current-professor','release.json')
          import json
          expected='e97eb321b15efd3068a9b10b9f3e399cb8b1a2495e33d8b5d82cb792ba347a23'
          with open('release.json',encoding='utf-8') as f:
              r=json.load(f)
          assert r['id']==389939118
          assert r['tag_name']=='v0.1.0-eval.7-current-professor'
          assert r['draft'] is False
          assert r['prerelease'] is True
          assets={a['name']:a for a in r['assets']}
          a=assets['OMR_Current_Eval7_Professor_Installable.zip']
          assert a['id']==568003218
          assert a['size']==5136381
          assert a.get('digest')=='sha256:'+expected
          receipt=assets['FINAL_RECEIPT.txt']
          assert receipt['id']==568003219
          print('PUBLIC_RELEASE_METADATA=PASS immutable='+str(r.get('immutable')).lower())
      - name: Verify release tag points to the documented public commit
        run: |
          import urllib.request,time
          def download(url,target):
              for attempt in range(5):
                  try:
                      request=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','User-Agent':'SSTAI-existing-public-release-validator'})
                      with urllib.request.urlopen(request,timeout=60) as response:
                          data=response.read()
                      from pathlib import Path
                      Path(target).write_bytes(data)
                      return
                  except Exception:
                      if attempt==4:raise
                      time.sleep(2)
          download('https://api.github.com/repos/Sahand-Shahhosseini/SSTAI-Labs-OMR-Evaluation/git/ref/tags/v0.1.0-eval.7-current-professor','release-tag.json')
          import json
          from pathlib import Path
          actual=json.loads(Path('release-tag.json').read_text(encoding='utf-8'))['object']['sha']
          assert actual=='74db0baec0ec5523ac49ae84af0443f71d27563a'
          print('PUBLIC_TAG_TARGET=PASS',actual)
