name: Public Dual-OS Hosted Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/public-dual-os-hosted-smoke.yml'

permissions:
  contents: read

jobs:
  hosted-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Verify isolated hosted runner
        shell: bash
        if: runner.os == 'Linux'
        run: |
          test "$RUNNER_OS" = "Linux"
          echo "PUBLIC_DUAL_OS_SMOKE=PASS"
          echo "RUNNER_OS=$RUNNER_OS"
      - name: Verify isolated hosted runner
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          if($env:RUNNER_OS -ne 'Windows'){ throw "RUNNER_OS_MISMATCH:$env:RUNNER_OS" }
          Write-Host 'PUBLIC_DUAL_OS_SMOKE=PASS'
          Write-Host "RUNNER_OS=$env:RUNNER_OS"
